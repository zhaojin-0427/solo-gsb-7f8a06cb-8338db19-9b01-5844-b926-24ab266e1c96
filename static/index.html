<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPUB3 章节跳转修复</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <h1>EPUB3 章节跳转修复</h1>
  <div class="sub">本地运行 · 未加密 EPUB · ZIP ≤ 20 MB · 解压 ≤ 50 MB · XHTML ≤ 30 篇</div>
</header>

<main>
  <!-- 上传 -->
  <section class="card" id="uploadCard">
    <form id="uploadForm">
      <label class="upload-box">
        <input type="file" id="fileInput" accept=".epub,application/epub+zip" hidden>
        <span id="uploadLabel">选择或拖入未加密的 .epub 文件</span>
      </label>
      <button type="submit" id="uploadBtn" disabled>上传并分析</button>
    </form>
    <div id="uploadMsg" class="msg"></div>
  </section>

  <!-- 致命错误（无法继续分析） -->
  <section class="card hidden" id="fatalCard">
    <h2>无法解析该 EPUB</h2>
    <div id="fatalBox" class="fault fatal"></div>
    <p class="hint">请根据定位信息修正原包后重新上传。</p>
  </section>

  <!-- 分析结果 -->
  <section class="card hidden" id="resultCard">
    <div class="result-head">
      <div>
        <h2 id="bookTitle">分析结果</h2>
        <div class="meta" id="bookMeta"></div>
      </div>
      <div class="actions">
        <label class="check-line">
          <input type="checkbox" id="showAllLinks">
          显示全部链接（含有效/外部）
        </label>
        <button id="exportBtn" class="primary" disabled>导出修复后的 EPUB</button>
      </div>
    </div>

    <div id="faultBox" class="hidden">
      <h3>结构 / 定位问题（存在时禁止导出）</h3>
      <div id="faultList"></div>
    </div>

    <div class="panes">
      <div class="pane">
        <h3>正文与目录</h3>
        <ol id="chapterList" class="chapter-list"></ol>
      </div>
      <div class="pane pane-wide">
        <h3 id="linkTitle">失效链接</h3>
        <div id="linkStats" class="link-stats"></div>
        <div class="table-wrap">
          <table id="linkTable">
            <thead>
              <tr>
                <th>#</th>
                <th>来源文件</th>
                <th>链接文字</th>
                <th>原 href</th>
                <th>问题</th>
                <th>新目标</th>
                <th>新 href 预览</th>
              </tr>
            </thead>
            <tbody id="linkTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div id="exportMsg" class="msg"></div>
  </section>
</main>

<footer>
  <span>所有处理均在本机完成，文件不会上传到任何外部服务。</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
